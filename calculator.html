<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Tiger Trains - Calculator</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/3.3.0/math.min.js"></script>
</head>

<body>
  <header class="page-header">
    <h1 id="underlined">Tiger Trains</h1>
    <div class="dropdown">
      <button id="underlined">Menu</button>
      <div class="dropdown-content">
        <a class="page-button" href="games.html">Games</a>
        <a class="page-button" href="info.html">Info</a>
        <a class="page-button" href="projects.html">Projects</a>
        <a class="page-button" href="scratch.html">Scratch Games</a>
        <a href="https://Johnny-Airlines.co.uk">Johnny Airlines</a>
        <a class="page-button" href="bitsnbytes/index.html">Bits & Bytes</a>
      </div>
    </div>
  </header>

  <h2 id="underlined">Calculator</h2>

  <script>
    function display(num) {
      document.getElementById("input").value += num;
    }
    function equal() {
      document.getElementById("input").value = math.eval(document.getElementById("input").value);
    }
  </script>

  <div class="calculator-container">
    <div class="calculator-grid">
      <input type="text" id="input" placeholder="Enter Numbers Here">
      <button onclick="display(1)">1</button>
      <button onclick="display(2)">2</button>
      <button onclick="display(3)">3</button>
      <button onclick="display(4)">4</button>
      <button onclick="display(5)">5</button>
      <button onclick="display(6)">6</button>
      <button onclick="display(7)">7</button>
      <button onclick="display(8)">8</button>
      <button onclick="display(9)">9</button>
      <button onclick="display('+')">+</button>
      <button onclick="display(0)">0</button>
      <button onclick="display('-')">-</button>
      <button onclick="display('*')">*</button>
      <button onclick="display('/')">/</button>
      <button onclick="equal()">=</button>
    </div>
  </div>

  <div class="page-list page-button-calculatorhome">
    <a href="index.html">Home Page</a>
  </div>

</body>

</html>
